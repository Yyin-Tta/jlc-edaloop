[project]
name = "edaloop"
version = "0.2.0"
description = "Open-source schematic-design agent for EasyEDA Pro: RAG knowledge base, two-stage generation, mechanical validation loop"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pymupdf>=1.24",
    "httpx>=0.27",
    "sqlite-vec>=0.1.6",
    "python-dotenv>=1.0",
]

[project.scripts]
edaloop = "edaloop.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edaloop", "skills"]

[tool.pytest.ini_options]
testpaths = ["tests"]

