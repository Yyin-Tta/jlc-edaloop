[project]
name = "edaloop"
version = "0.7.0"
description = "Open-source schematic-design agent for EasyEDA Pro: RAG knowledge base, two-stage generation, mechanical validation loop"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pymupdf>=1.24",
    "httpx>=0.27",
    "sqlite-vec>=0.1.6",
    "python-dotenv>=1.0",
]

[project.scripts]
edaloop = "edaloop.cli:main"

# Web UI 会话层(纪律同 ADR-0002 easyeda-agent):核心依赖零增量,UI 走 extra
[project.optional-dependencies]
ui = ["chainlit>=2,<3"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edaloop", "skills"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# 外部依赖钉死(ADR-0002):easyeda-agent CLI/daemon/连接器、skill,升级须独立 PR + 全量 evals 回归
[tool.edaloop]
easyeda-agent = "1.2.10"
